{% extends "core/base.html" %}

{% load static %}

{% block extra_css %}

<link rel="stylesheet" href="{% static 'css/login.css' %}">

{% endblock %}

{% block content %}

<section class="login">
    <div class="login__header">
        <h2 class="login__title">
            Вход в систему
        </h2>

    </div>


    <form class="login__form" method="post">

        {% csrf_token %}

        <div class="login__fields">
            {{ form.as_p }}
        </div>

        <div class="login__actions">
            <button
                    class="login__submit"
                    type="submit"
            >
                Войти
            </button>
        </div>
    </form>
</section>

{% endblock %}
