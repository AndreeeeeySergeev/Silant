{% extends 'core/base.html' %}
{% block content %}
<h2>
  Техническое обслуживание
</h2>

{% for maintenance in maintenances %}
  <p>
    <a href="{% url 'core:maintenance_detail' maintenance.pk %}">
        {{ maintenance.machine.serial_number }}
    </a>
  </p>
{% empty %}
<p>
  Нет данных
</p>
{% endfor %}
{% endblock %}
